name: ${COMPOSE_NAME:-nota}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nota}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nota}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrations:
    build: ./Backend
    command: uv run alembic upgrade head
    environment: &backend-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nota}
      SECRET_KEY: ${SECRET_KEY:-development-secret-change-me}
      ROOT_PATH: /api
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}"]'
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./Backend
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./Frontend
    environment:
      VITE_API_URL: /api
    expose:
      - "5173"
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
